[package]
name = "ghost"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A process observatory for Linux: attach, and see everything."

[dependencies]
ghost-common = { path = "../ghost-common", features = ["user"] }

# eBPF load/attach (pin exact versions in Phase 0).
aya = "0.13"
aya-log = "0.2"

# CLI / errors / async
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

# TUI
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }

# pipeline / sessions
crossbeam-channel = "0.5"
lz4_flex = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# Compiles ghost-ebpf to BPF and emits the object for embedding.
aya-build = "0.1"

[[bin]]
name = "ghost"
path = "src/main.rs"

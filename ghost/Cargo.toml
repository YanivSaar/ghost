[package]
name = "ghost"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A process observatory for Linux: attach, and see everything."

[dependencies]
ghost-common = { path = "../ghost-common", features = ["user"] }

# eBPF load/attach (pin exact versions in Phase 0).
aya = "0.13"

# CLI / errors / async
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
thiserror = "1"

# TUI
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }

# pipeline / sessions
lz4_flex = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }

# Async-signal-safe SIGINT/SIGTERM → AtomicBool bridge for graceful shutdown.
signal-hook = { version = "0.3", default-features = false }

[dev-dependencies]
# Property-based testing for session round-trip + consumer dispatch invariants.
proptest = { version = "1", default-features = false, features = ["std"] }

[build-dependencies]
# Compiles ghost-ebpf to BPF and emits the object for embedding.
aya-build = "0.1"

[[bin]]
name = "ghost"
path = "src/main.rs"

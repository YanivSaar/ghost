name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools + LLVM for bpf-linker
        env:
          # bpf-linker's required LLVM major version. Bump this when
          # bpf-linker bumps its llvm-sys dep.
          LLVM_VERSION: "20"
        run: ./.github/scripts/install-llvm.sh

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src
          # bpfel-unknown-none has no prebuilt rust-std; ghost's build.rs
          # (via aya_build) uses -Zbuild-std with rust-src instead.

      - name: Install bpf-linker
        env:
          # Pinned pair: bpf-linker 0.9.15 is the newest release whose
          # `llvm-N` feature set still covers LLVM 20 (0.11+ require
          # LLVM 21+ which isn't broadly packaged yet).
          BPF_LINKER_VERSION: "0.9.15"
          BPF_LINKER_LLVM_FEATURE: "llvm-20"
        run: |
          cargo install bpf-linker --locked \
            --version "$BPF_LINKER_VERSION" \
            --no-default-features \
            --features "$BPF_LINKER_LLVM_FEATURE,rustc-build-sysroot"

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      # ghost-ebpf is a no_std BPF-target crate; host-side clippy/check
      # against it conflicts with std's lang-items (E0152). Build it via
      # ghost's build.rs instead, and clippy only the host crates.
      - name: clippy
        run: cargo clippy -p ghost -p ghost-common --all-targets -- -D warnings

      - name: build
        run: cargo build -p ghost --release --verbose

      - name: test
        run: cargo test -p ghost --verbose

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (LLVM + build tools)
        run: |
          sudo apt-get update
          # llvm-18-dev brings libLLVM and llvm-config-18 which the
          # llvm-sys build script (pulled in by bpf-linker) needs.
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libelf-dev \
            clang-18 lld-18 llvm-18 llvm-18-dev libclang-18-dev libpolly-18-dev
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          echo "LLVM_SYS_181_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"
          # bpf-linker's build.rs searches /usr/lib64 or /usr/lib for
          # libLLVM.so and ignores LLVM_SYS_*. On Ubuntu, llvm-18-dev
          # puts the lib at /usr/lib/llvm-18/lib/; symlink it where
          # bpf-linker will find it. ldconfig makes it findable at
          # runtime for the linked bpf-linker binary.
          sudo mkdir -p /usr/lib64
          sudo ln -sf /usr/lib/llvm-18/lib/libLLVM.so   /usr/lib64/libLLVM.so
          sudo ln -sf /usr/lib/llvm-18/lib/libLLVM.so.1 /usr/lib64/libLLVM.so.1 || true
          echo "/usr/lib/llvm-18/lib" | sudo tee /etc/ld.so.conf.d/llvm-18.conf
          sudo ldconfig

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src
          # bpfel-unknown-none has no prebuilt rust-std; ghost's build.rs
          # (via aya_build) uses -Zbuild-std with rust-src instead.

      - name: Install bpf-linker
        run: cargo install bpf-linker --locked

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      # ghost-ebpf is a no_std BPF-target crate; host-side clippy/check
      # against it conflicts with std's lang-items (E0152). Build it via
      # ghost's build.rs instead, and clippy only the host crates.
      - name: clippy
        run: cargo clippy -p ghost -p ghost-common --all-targets -- -D warnings

      - name: build
        run: cargo build -p ghost --release --verbose

      - name: test
        run: cargo test -p ghost --verbose

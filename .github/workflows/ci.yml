name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src
          # bpfel-unknown-none has no prebuilt rust-std; ghost's build.rs
          # (via aya_build) uses -Zbuild-std with rust-src instead.

      # bpf-linker and rustc share an LLVM bitcode ABI, so bpf-linker's
      # LLVM major must match rustc's. Detect it, then install the right
      # pair.
      - name: Detect LLVM / bpf-linker versions
        run: ./.github/scripts/detect-versions.sh

      - name: Install LLVM for bpf-linker
        run: ./.github/scripts/install-llvm.sh

      - name: Install bpf-linker
        run: |
          # 0.9.x shipped --features gating; 0.10+ makes the LLVM
          # feature the crate's default and dropped the gating subset,
          # so --no-default-features isn't needed (and would break).
          if [[ "$BPF_LINKER_VERSION" == 0.9.* ]]; then
            cargo install bpf-linker --locked \
              --version "$BPF_LINKER_VERSION" \
              --no-default-features \
              --features "$BPF_LINKER_LLVM_FEATURE,rustc-build-sysroot"
          else
            cargo install bpf-linker --locked \
              --version "$BPF_LINKER_VERSION"
          fi

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      # ghost-ebpf is a no_std BPF-target crate; host-side clippy/check
      # against it conflicts with std's lang-items (E0152). Build it via
      # ghost's build.rs instead, and clippy only the host crates.
      - name: clippy
        run: cargo clippy -p ghost -p ghost-common --all-targets -- -D warnings

      - name: build
        run: cargo build -p ghost --release --verbose

      - name: test
        run: cargo test -p ghost --verbose

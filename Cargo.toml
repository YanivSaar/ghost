[workspace]
resolver = "2"
members = ["ghost", "ghost-ebpf", "ghost-common"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Build small, fast BPF + a lean release binary.
[profile.release]
lto = true
codegen-units = 1
strip = true

# BPF programs must be optimised even in dev builds so the verifier
# accepts them; put the ghost-ebpf-specific tweak here at the workspace
# root (Cargo ignores profile sections in non-root packages).
[profile.dev.package.ghost-ebpf]
opt-level = 3
